# Publishes to npm and GHCR, then creates the GitHub Release, when a version tag (v2.0.0, …) is pushed.
# Needs the repository secret NPM_TOKEN (an npm automation token).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write # npm provenance

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/canvas-readonly-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # The GitHub Release page, with the matching CHANGELOG.md section as notes and the
  # Claude Desktop extension (.mcpb) attached, then the MCP Registry entry (server.json) listing
  # both the npm package and that .mcpb. Runs only once both packages are out: the registry
  # checks the published npm package's mcpName.
  github-release:
    needs: [npm, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # mcp-publisher login github-oidc
    env:
      MCP_PUBLISHER_VERSION: "1.8.6"
      MCP_PUBLISHER_SHA256: 1fbe93fc0783c2394d8012c8d6e50a59e98cb2cc2d216264cc69f405d0e21340 # linux_amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the Claude Desktop extension
        run: npm run bundle
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## / { if (found) exit; found = ($2 == v); next } found' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bundle="canvas-readonly-mcp-${GITHUB_REF_NAME#v}.mcpb"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; only (re)attaching $bundle."
            gh release upload "$GITHUB_REF_NAME" "$bundle" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md "$bundle"
          fi
      - name: Add the Desktop extension to server.json
        run: |
          bundle="canvas-readonly-mcp-${GITHUB_REF_NAME#v}.mcpb"
          node -e '
            const fs = require("fs");
            const [bundle, url] = process.argv.slice(1);
            const sha = require("crypto").createHash("sha256").update(fs.readFileSync(bundle)).digest("hex");
            const server = JSON.parse(fs.readFileSync("server.json", "utf8"));
            if (server.version !== process.env.GITHUB_REF_NAME.slice(1)) throw new Error(`server.json version ${server.version} does not match the tag`);
            server.packages.push({ registryType: "mcpb", identifier: url, fileSha256: sha, transport: { type: "stdio" } });
            fs.writeFileSync("server.json", JSON.stringify(server, null, 2) + "\n");
          ' "$bundle" "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/${bundle}"
          cat server.json
      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
